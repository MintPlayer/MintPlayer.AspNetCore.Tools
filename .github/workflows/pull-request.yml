name: pull-request

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    name: pull-request
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # packages: read is required, not optional. setup-dotnet below configures the GPR feed as a
      # NuGet source and `dotnet restore` authenticates to it with github.token. Before this
      # workflow had an explicit permissions block it inherited the default token scopes, which
      # include this one; tightening to `contents: read` alone made restore log
      # "Your request could not be authenticated by the GitHub Packages service" twice per run.
      packages: read

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # In a pull request we must make sure both the angular/dotnet library build.

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.100
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # --no-build: `--no-restore` alone does NOT imply it. Without this the solution gets
      # built a second time in Debug and coverage is measured on THAT build rather than the
      # Release one the step above just produced.
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, one per test project, hence the ** in the upload glob below.
      run: >
        dotnet test --no-restore --no-build --configuration Release
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Assert tests actually ran
      # `dotnet test` exits 0 and prints NOTHING when it finds no test project — verified on
      # SDK 10.0.400. So a test project accidentally left out of the .sln, or a broken
      # collector, is indistinguishable from a passing run. This step is the difference
      # between "green" and "green because it ran the tests".
      run: |
        shopt -s globstar nullglob
        reports=(coverage/**/coverage.cobertura.xml)
        if [ ${#reports[@]} -eq 0 ]; then
          echo "::error::No coverage report was produced. Either no test project ran, or the coverlet collector failed."
          exit 1
        fi
        echo "Found ${#reports[@]} coverage report(s):"
        printf '  %s\n' "${reports[@]}"

    # Nothing here gates the merge. The service publishes the `coverage/project` and
    # `coverage/patch` check runs itself through its GitHub App, and those are what branch
    # protection would require.
    #
    # No `partial:` — this runs the whole test suite on every PR, so the upload really is a
    # whole-workspace total. Declaring it partial would misreport it.
    - name: Upload coverage
      # Fork PRs get no secrets, so the upload cannot work there. Skip rather than fail — a
      # contributor's PR must not go red over a missing token.
      if: >
        github.event.pull_request.head.repo.full_name == github.repository
        && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        # Must be exactly this value, not a "normalised" variant: it doubles as the OIDC
        # audience server-side.
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        # Not cosmetic: with search on, a glob that matches nothing falls back to
        # auto-detection over nine well-known patterns and would upload stray unparsable
        # reports (the action auto-detects coverage-final.json and clover.xml, for which the
        # server has no parser).
        disable-search: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # Closes the build now instead of waiting out the server's ~2-minute debounce, so the
        # check runs appear while the PR is still being looked at.
        finish: true
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false
