name: publish-release

on:
  push:
    branches:
      - 'master'
      # - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: publish-release
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        # The .NET 11 SDK builds everything (global.json pins it). The .NET 10 SDK is installed for
        # its runtime, which is what actually executes the net10.0 half of the test suite; without it
        # `dotnet test` has no net10.0 host to run on.
        # Pinned exactly rather than 11.0.x: while .NET 11 is RC, a floating version would let an RC2
        # change CI behaviour without a commit.
        dotnet-version: |
          10.0.x
          11.0.100-rc.1.26425.128

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # --no-build: `--no-restore` alone does NOT imply it. Without this the solution gets
      # built a second time in Debug and coverage is measured on that build while the Pack
      # step below ships the Release one.
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, one per test project, hence the ** in the upload glob below.
      run: >
        dotnet test --no-restore --no-build --configuration Release
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Assert tests actually ran
      # `dotnet test` exits 0 and prints NOTHING when it finds no test project — verified on
      # SDK 10.0.400. Without this step a test project accidentally left out of the .sln is
      # indistinguishable from a passing run, and this workflow would publish to NuGet on
      # the strength of a green check that tested nothing.
      run: |
        shopt -s globstar nullglob
        reports=(coverage/**/coverage.cobertura.xml)
        if [ ${#reports[@]} -eq 0 ]; then
          echo "::error::No coverage report was produced. Either no test project ran, or the coverlet collector failed."
          exit 1
        fi
        echo "Found ${#reports[@]} coverage report(s):"
        printf '  %s\n' "${reports[@]}"

    # Deliberately BEFORE Pack: see fail-ci-if-error below.
    - name: Upload coverage
      # hashFiles guard: a run that produced no report is a no-op rather than an upload of
      # nothing.
      if: always() && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        # Must be exactly this value, not a "normalised" variant: it doubles as the OIDC
        # audience server-side.
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to auto-detection
        # and would upload stray unparsable reports.
        disable-search: true
        finish: true
        # A coverage-service outage, or a missing COVERAGE_TOKEN, must not fail this workflow
        # before Pack and block a NuGet release over a reporting problem.
        fail-ci-if-error: false

    - name: Version the packages
      id: versioning
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@a0f9e20f3d7f91814d00c598c64b4a39cd1f1c45 # versioning-v1

    - name: Pack
      run: dotnet pack --configuration Release /p:ContinuousIntegrationBuild=true

    - name: PushNuget
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.PUBLISH_TO_NUGET_ORG }} --skip-duplicate

    - name: PushGithub
      # Explicit source: GitHub Packages is deliberately NOT a restore source on CI. A restore source answering
      # 403 for a package this repository's token may not read fails the whole restore (MintPlayer/MintPlayer.Dotnet.Tools#200).
      run: dotnet nuget push **/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ github.token }} --no-symbols --skip-duplicate
