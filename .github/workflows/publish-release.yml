name: publish-release

on:
  push:
    branches:
      - 'master'
      - 'release/*-*.x'
      # - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: publish-release
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        # Matches global.json. .NET 10 is served from the release/dotnet-10.x line, not by
        # multi-targeting here.
        dotnet-version: 11.0.100

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # --no-build: `--no-restore` alone does NOT imply it. Without this the solution gets
      # built a second time in Debug and coverage is measured on that build while the Pack
      # step below ships the Release one.
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, one per test project, hence the ** in the upload glob below.
      run: >
        dotnet test --no-restore --no-build --configuration Release
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Assert tests actually ran
      # `dotnet test` exits 0 and prints NOTHING when it finds no test project — verified on
      # SDK 10.0.400 and 11.0.100. Without this step a test project accidentally left out of the .sln is
      # indistinguishable from a passing run, and this workflow would publish to NuGet on
      # the strength of a green check that tested nothing.
      run: |
        shopt -s globstar nullglob
        reports=(coverage/**/coverage.cobertura.xml)
        if [ ${#reports[@]} -eq 0 ]; then
          echo "::error::No coverage report was produced. Either no test project ran, or the coverlet collector failed."
          exit 1
        fi
        echo "Found ${#reports[@]} coverage report(s):"
        printf '  %s\n' "${reports[@]}"

    # Deliberately BEFORE Pack: see fail-ci-if-error below.
    - name: Upload coverage
      # hashFiles guard: a run that produced no report is a no-op rather than an upload of
      # nothing.
      if: always() && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        # Must be exactly this value, not a "normalised" variant: it doubles as the OIDC
        # audience server-side.
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to auto-detection
        # and would upload stray unparsable reports.
        disable-search: true
        finish: true
        # A coverage-service outage, or a missing COVERAGE_TOKEN, must not fail this workflow
        # before Pack and block a NuGet release over a reporting problem.
        fail-ci-if-error: false

    - name: Version the packages
      id: versioning
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@versioning-v1

    # With release lines on, the default branch tags nothing: a package with no tag yet would fail its
    # pack (MPV005). The release lines pack and publish; the default branch only when it released.
    - name: Decide whether this run publishes
      id: publishes
      env:
        RELEASED: ${{ steps.versioning.outputs.released }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && { [ -z "$RELEASED" ] || [ "$RELEASED" = "[]" ]; }; then
          echo "The default branch released nothing (release lines on, or no change): no pack, no publish."
          echo "value=false" >> "$GITHUB_OUTPUT"
        else
          echo "value=true" >> "$GITHUB_OUTPUT"
        fi

    # No --no-build: the versions are decided after the tests, so pack builds again to stamp them into the
    # assemblies (--no-build also skips restore, which leaves the nuspec's dependency versions stale).
    - name: Pack
      if: steps.publishes.outputs.value == 'true'
      run: dotnet pack --configuration Release /p:ContinuousIntegrationBuild=true

    - name: Check the packages carry the released versions
      if: steps.publishes.outputs.value == 'true'
      id: packed-versions
      shell: bash
      env:
        VERSIONS: ${{ steps.versioning.outputs.versions }}
        DIST_TAGS: ${{ steps.versioning.outputs.dist-tags }}
      run: |
        # --skip-duplicate turns a pack at another version into "already exists" and a green run that published
        # nothing (#638): every released NuGet package must have been packed at the version it was released as.
        versions="${VERSIONS:-}"; [ -n "$versions" ] || versions='{}'
        npm="${DIST_TAGS:-}"; [ -n "$npm" ] || npm='{}'
        status=0
        while IFS=$'\t' read -r id version; do
          version="${version%$'\r'}"; [ -n "$id" ] || continue
          if [ -z "$(find . -iname "$id.$version.nupkg" -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "::error::$id was released as $version, but no $id.$version.nupkg was packed."
            status=1
          fi
        done < <(jq -r --argjson npm "$npm" 'to_entries[] | select(.key as $k | $npm | has($k) | not) | "\(.key)\t\(.value)"' <<< "$versions")
        exit $status

    # Trusted publishing: the job's GitHub OIDC token (id-token: write) is exchanged for a short-lived
    # nuget.org API key. The policy lives on nuget.org (owner MintPlayer, workflow publish-release.yml);
    # a package outside its patterns is refused. `user` is the nuget.org profile that owns the policy.
    - name: NuGet login (trusted publishing)
      if: steps.publishes.outputs.value == 'true'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: Pieterjan

    - name: PushNuget
      if: steps.publishes.outputs.value == 'true'
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

    - name: PushGithub
      if: steps.publishes.outputs.value == 'true'
      # Explicit source: GitHub Packages is deliberately NOT a restore source on CI. A restore source answering
      # 403 for a package this repository's token may not read fails the whole restore (MintPlayer/MintPlayer.Dotnet.Tools#200).
      run: dotnet nuget push **/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ github.token }} --no-symbols --skip-duplicate
